# Fail2ban filter — repeated NOD CRM login submissions.
#
# Targets only the access log of the NOD CRM virtual host: no other site is
# affected.
#
# Note: the application answers 200 even on a rejected password (a Server
# Action re-rendering the form). So this counts the VOLUME of POST /login per
# IP, not failures — failures are handled inside the application.

[Definition]
# Nginx default "combined" log format.
failregex = ^<HOST> -.*"POST /login[^"]*" (200|303|429) 

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
