# NOD CRM — dedicated rate-limit zone.
#
#   sudo install -o root -g root -m 644 nod-crm-limits.conf \
#        /etc/nginx/conf.d/nod-crm-limits.conf
#
# `limit_req_zone` only exists at the `http` level, hence conf.d/, which the
# default Debian nginx.conf includes. This file only ADDS a zone: existing
# zones and other virtual hosts are untouched.
#
# 10 requests/minute per IP, with a burst of 10 in the virtual host: well above
# human use (a few password attempts), well below automated brute force. 10 MB
# tracks roughly 160,000 addresses.
#
# Rejected requests log "limiting requests" in THIS virtual host's error log,
# not in /var/log/nginx/error.log — which is what the stock `nginx-limit-req`
# Fail2ban jail watches. See deploy/fail2ban/nod-crm.local, which declares a
# separate jail pointed at the right file rather than widening the stock one.

limit_req_zone $binary_remote_addr zone=nodcrm_login:10m rate=10r/m;
