# NOD CRM — reverse proxy headers.
#
#   sudo install -o root -g root -m 644 nod-crm-proxy.conf \
#        /etc/nginx/snippets/nod-crm-proxy.conf
#
# A dedicated snippet: no existing snippet is modified.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Nginx sets these on every request, so an external client cannot forge them.
# That is what makes `X-Real-IP` trustworthy for application rate limiting —
# and it is the ONLY header NOD CRM reads for that purpose. `X-Forwarded-For`
# is deliberately ignored by the application: with the usual
# `$proxy_add_x_forwarded_for`, its first element is attacker-controlled.

# Server Components stream: no buffering.
proxy_buffering off;
proxy_request_buffering off;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# No `Upgrade` handling: NOD CRM opens no WebSocket in V0.1. The usual
# `$connection_upgrade` variable needs an http-level `map`, and your server may
# already define one for another service — a second declaration would break
# `nginx -t` and block every reload.

# The application emits its own security headers: they are not overwritten.
proxy_hide_header X-Powered-By;
